[build]
  command = "npm run build"
  publish = "frontend/build"
  functions = "netlify/functions"

[functions."scheduled-monitor"]
  schedule = "*/5 * * * *"

# Mirrors the response security headers server.mts sets for self-hosted
# deployments. The fallback adds an immediate response-header CSP while
# SvelteKit's per-page meta policy applies the stricter generated script hash.
# Browsers enforce both policies. Keep the immutable rule first because
# Netlify applies the first matching header rule. The fallback no-transform
# directive prevents edge services from injecting scripts into prerendered HTML.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-transform"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000"

[[redirects]]
  from = "/guide"
  to = "/resources"
  status = 308
  force = true

[[redirects]]
  from = "/guide/"
  to = "/resources"
  status = 308
  force = true

[[redirects]]
  from = "/api/lookup"
  to = "/.netlify/functions/lookup"
  status = 200
  force = true
  [redirects.rate_limit]
    window_limit = 1000
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/rdap"
  to = "/.netlify/functions/rdap"
  status = 200
  force = true

[[redirects]]
  from = "/api/rdap-nameserver-search"
  to = "/.netlify/functions/rdap-nameserver-search"
  status = 200
  force = true

[[redirects]]
  from = "/api/whois"
  to = "/.netlify/functions/whois"
  status = 200
  force = true

[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200
  force = true

# The login function exports its own /api/login path and function-level rate
# limit. Its custom path removes the default direct function endpoint.

# The contact-route function likewise exports /api/contact-route directly and
# applies its own public edge limit before server-side challenge verification.

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200
  force = true

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200
  force = true

[[redirects]]
  from = "/api/capabilities"
  to = "/.netlify/functions/capabilities"
  status = 200
  force = true

[[redirects]]
  from = "/api/scheduled-monitor"
  to = "/.netlify/functions/scheduled-monitor-management"
  status = 200
  force = true

[[redirects]]
  from = "/api/ct-search"
  to = "/.netlify/functions/ct-search"
