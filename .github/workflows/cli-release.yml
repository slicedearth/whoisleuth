name: CLI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version selected by the release tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cli-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    outputs:
      source-sha: ${{ steps.provenance.outputs.source-sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify release selection and exact tagged CI
        id: provenance
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/release-provenance.mts
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Audit production dependencies
        run: npm run dependencies:audit
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts --audit=false
      - name: Verify release and notices
        run: |
          npm run release:check
          npm run licenses:check
      - name: Test package contracts
        run: node --test test/cli-package.test.mts test/cli-package-boundary.test.mts test/cli-process.test.mts
      - name: Assemble exact release candidate
        env:
          EXPECTED_TAG: v${{ inputs.version }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: npm run cli:package:release -- "$RELEASE_DIRECTORY" --tag "$EXPECTED_TAG" --json
      - name: Audit installed candidate dependencies
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: npm run dependencies:audit -- --installed-candidate "$RELEASE_DIRECTORY/installed-dependencies.json"
      - name: Verify candidate digest
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: |
          cd "$RELEASE_DIRECTORY"
          archives=( *.tgz )
          test "${#archives[@]}" -eq 1
          sha256sum --check "${archives[0]}.sha256"
      - name: Bind reviewed candidate reports and dependency evidence
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: node tools/published-cli-check.mts "$EXPECTED_VERSION" --candidate-report "$RELEASE_DIRECTORY/cli-package-report.json" --candidate-archive "$RELEASE_DIRECTORY/whoisleuth-cli-$EXPECTED_VERSION.tgz" --installed-dependencies "$RELEASE_DIRECTORY/installed-dependencies.json" --offline
      - name: Upload reviewed candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whoisleuth-cli-release-candidate
          path: ${{ runner.temp }}/whoisleuth-cli-release/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact reviewed validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download reviewed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: whoisleuth-cli-release-candidate
          path: ${{ runner.temp }}/whoisleuth-cli-release
      - name: Verify downloaded candidate
        id: candidate
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: |
          cd "$RELEASE_DIRECTORY"
          archives=( *.tgz )
          test "${#archives[@]}" -eq 1
          sha256sum --check "${archives[0]}.sha256"
          echo "archive=$RELEASE_DIRECTORY/${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Recheck downloaded report and dependency evidence binding
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: node tools/published-cli-check.mts "$EXPECTED_VERSION" --candidate-report "$RELEASE_DIRECTORY/cli-package-report.json" --candidate-archive "$RELEASE_DIRECTORY/whoisleuth-cli-$EXPECTED_VERSION.tgz" --installed-dependencies "$RELEASE_DIRECTORY/installed-dependencies.json" --offline
      - name: Stage reviewed version with provenance
        run: npm stage publish "${{ steps.candidate.outputs.archive }}" --access public --provenance
