name: CLI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version selected by the release tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cli-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate release selection
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import manifest from "./package.json" with { type: "json" };
            import { normalizeBoundedStableSemanticVersion } from "./lib/semantic-version.mts";
            const expected = process.env.EXPECTED_VERSION || "";
            normalizeBoundedStableSemanticVersion(expected, "The selected release");
            if (manifest.version !== expected || manifest.private !== true) {
              throw new Error("The selected version must match the private root manifest.");
            }
            if (process.env.GITHUB_REF !== `refs/tags/v${expected}`) {
              throw new Error("Run the workflow from the exact semantic release tag.");
            }
          '
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify exact tagged SHA passed CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e '
            const repository = process.env.GITHUB_REPOSITORY || "";
            const sha = process.env.GITHUB_SHA || "";
            const githubCredential = process.env.GITHUB_TOKEN || "";
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/u.test(repository) || !/^[a-f0-9]{40}$/u.test(sha) || !githubCredential) {
              throw new Error("Release CI provenance inputs are unavailable.");
            }
            const endpoint = new URL(`https://api.github.com/repos/${repository}/actions/workflows/ci.yml/runs`);
            endpoint.searchParams.set("head_sha", sha);
            endpoint.searchParams.set("status", "completed");
            endpoint.searchParams.set("per_page", "100");
            const response = await fetch(endpoint, {
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${githubCredential}`,
                "x-github-api-version": "2022-11-28",
              },
            });
            if (!response.ok) throw new Error(`Could not verify release CI provenance (${response.status}).`);
            const payload = await response.json();
            const runs = Array.isArray(payload.workflow_runs) ? payload.workflow_runs : [];
            const verified = runs.some((run) => run?.head_sha === sha && run?.event === "push" && run?.conclusion === "success");
            if (!verified) throw new Error("The exact tagged commit must have a successful completed push run of ci.yml.");
          '
      - name: Audit production dependencies
        run: npm run dependencies:audit
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts --audit=false
      - name: Verify release and notices
        run: |
          npm run release:check
          npm run licenses:check
      - name: Test package contracts
        run: node --test test/cli-package.test.mts test/cli-package-boundary.test.mts test/cli-process.test.mts
      - name: Assemble exact release candidate
        env:
          EXPECTED_TAG: v${{ inputs.version }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: npm run cli:package:release -- "$RELEASE_DIRECTORY" --tag "$EXPECTED_TAG" --json
      - name: Verify candidate digest
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: |
          cd "$RELEASE_DIRECTORY"
          archives=( *.tgz )
          test "${#archives[@]}" -eq 1
          sha256sum --check "${archives[0]}.sha256"
      - name: Upload reviewed candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whoisleuth-cli-release-candidate
          path: ${{ runner.temp }}/whoisleuth-cli-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download reviewed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: whoisleuth-cli-release-candidate
          path: ${{ runner.temp }}/whoisleuth-cli-release
      - name: Verify downloaded candidate
        id: candidate
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: |
          cd "$RELEASE_DIRECTORY"
          archives=( *.tgz )
          test "${#archives[@]}" -eq 1
          sha256sum --check "${archives[0]}.sha256"
          echo "archive=$RELEASE_DIRECTORY/${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Stage reviewed version with provenance
        run: npm stage publish "${{ steps.candidate.outputs.archive }}" --access public --provenance
