name: CLI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version selected by the release tag
        required: true
        type: string
      publication_mode:
        description: The first version publishes directly; later versions enter npm staging
        required: true
        default: stage-publish
        type: choice
        options:
          - stage-publish
          - initial-publish

permissions:
  contents: read

concurrency:
  group: cli-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate release selection
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
        run: |
          node --input-type=module -e '
            import manifest from "./package.json" with { type: "json" };
            const expected = process.env.EXPECTED_VERSION || "";
            if (!/^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/.test(expected)) {
              throw new Error("The selected version must be a stable semantic version.");
            }
            if (manifest.version !== expected || manifest.private !== true) {
              throw new Error("The selected version must match the private root manifest.");
            }
            if (process.env.GITHUB_REF !== `refs/tags/v${expected}`) {
              throw new Error("Run the workflow from the exact semantic release tag.");
            }
            if (process.env.PUBLICATION_MODE === "initial-publish" && expected !== "1.32.0") {
              throw new Error("Direct publication is restricted to the first public CLI version.");
            }
          '
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Verify release and notices
        run: |
          npm run release:check
          npm run licenses:check
      - name: Test package contracts
        run: node --test test/cli-package.test.mts test/cli-package-boundary.test.mts test/cli-process.test.mts
      - name: Assemble exact release candidate
        env:
          EXPECTED_TAG: v${{ inputs.version }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: npm run cli:package:release -- "$RELEASE_DIRECTORY" --tag "$EXPECTED_TAG" --json
      - name: Verify candidate digest
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: |
          cd "$RELEASE_DIRECTORY"
          archives=( *.tgz )
          test "${#archives[@]}" -eq 1
          sha256sum --check "${archives[0]}.sha256"
      - name: Upload reviewed candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whoisleuth-cli-release-candidate
          path: ${{ runner.temp }}/whoisleuth-cli-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download reviewed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: whoisleuth-cli-release-candidate
          path: ${{ runner.temp }}/whoisleuth-cli-release
      - name: Verify downloaded candidate
        id: candidate
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: |
          cd "$RELEASE_DIRECTORY"
          archives=( *.tgz )
          test "${#archives[@]}" -eq 1
          sha256sum --check "${archives[0]}.sha256"
          echo "archive=$RELEASE_DIRECTORY/${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish first public version with provenance
        if: inputs.publication_mode == 'initial-publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN }}
        run: npm publish "${{ steps.candidate.outputs.archive }}" --access public --provenance
      - name: Stage subsequent version with provenance
        if: inputs.publication_mode == 'stage-publish'
        run: npm stage publish "${{ steps.candidate.outputs.archive }}" --access public --provenance
