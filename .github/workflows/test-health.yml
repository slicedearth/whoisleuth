name: Test health

on:
  schedule:
    - cron: '43 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-health
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install tested shell
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Verify development toolchain compatibility
        run: npm run toolchain:check
      - name: Run expanded property checks
        env:
          WHOISLEUTH_FAST_CHECK_RUN_MULTIPLIER: '10'
          WHOISLEUTH_FAST_CHECK_SEED: ${{ github.run_number }}
        run: npm run test:properties
      - name: Verify retained timing contract without rewriting it
        run: npm run verification:timing:check
      - name: Report offline retained source health
        run: |
          set -o pipefail
          npm run sources:health | tee "$RUNNER_TEMP/source-health-report.txt"
          npm run sources:health -- --github-annotations
          {
            echo '## Offline retained source health'
            echo '```text'
            cat "$RUNNER_TEMP/source-health-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Profile the complete unit suite three times
        run: |
          set -o pipefail
          for run in 1 2 3; do
            npm run test:profile > "$RUNNER_TEMP/test-duration-report-$run.txt"
          done
      - name: Compare median duration health
        run: |
          set -o pipefail
          npm run test:duration-health -- \
            --report="$RUNNER_TEMP/test-duration-report-1.txt" \
            --report="$RUNNER_TEMP/test-duration-report-2.txt" \
            --report="$RUNNER_TEMP/test-duration-report-3.txt" \
            | tee "$RUNNER_TEMP/test-duration-health.md"
          cat "$RUNNER_TEMP/test-duration-health.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Build a directly reviewable unit timing candidate
        run: |
          npm run --silent verification:timing:update-candidate -- \
            --lane=unit \
            --report="$RUNNER_TEMP/test-duration-report-1.txt" \
            --report="$RUNNER_TEMP/test-duration-report-2.txt" \
            --report="$RUNNER_TEMP/test-duration-report-3.txt" \
            --provenance-id="unit-ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            --environment=linux-x64-node24-ci \
            --sample-basis=median-of-three-complete-unit-runs \
            > "$RUNNER_TEMP/verification-timing-unit-candidate.json"
      - name: Upload duration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-duration-profile
          path: |
            ${{ runner.temp }}/test-duration-report-*.txt
            ${{ runner.temp }}/test-duration-health.md
            ${{ runner.temp }}/verification-timing-unit-candidate.json
          if-no-files-found: ignore
          retention-days: 14
