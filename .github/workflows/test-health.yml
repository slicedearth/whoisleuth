name: Test health

on:
  schedule:
    - cron: '43 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-health
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install tested shell
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Run expanded property checks
        env:
          WHOISLEUTH_FAST_CHECK_RUN_MULTIPLIER: '10'
          WHOISLEUTH_FAST_CHECK_SEED: ${{ github.run_number }}
        run: npm run test:properties
      - name: Verify retained timing contract without rewriting it
        run: npm run verification:timing:check
      - name: Report offline retained source health
        run: |
          set -o pipefail
          npm run sources:health | tee "$RUNNER_TEMP/source-health-report.txt"
          {
            echo '## Offline retained source health'
            echo '```text'
            cat "$RUNNER_TEMP/source-health-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Profile the complete unit suite
        run: |
          set -o pipefail
          npm run test:profile | tee "$RUNNER_TEMP/test-duration-report.txt"
      - name: Upload duration profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-duration-profile
          path: ${{ runner.temp }}/test-duration-report.txt
          if-no-files-found: ignore
          retention-days: 14
