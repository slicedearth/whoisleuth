name: Published CLI check

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact public semantic version to verify
        required: true
        type: string
      release_run_id:
        description: Workflow run ID containing the reviewed CLI release candidate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: published-cli-check-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download reviewed release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whoisleuth-cli-release-candidate
          path: ${{ runner.temp }}/whoisleuth-cli-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
      - name: Verify exact published package against reviewed candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/whoisleuth-cli-release
        run: node tools/published-cli-check.mts "$RELEASE_VERSION" --candidate-report "$RELEASE_DIRECTORY/cli-package-report.json" --candidate-archive "$RELEASE_DIRECTORY/whoisleuth-cli-$RELEASE_VERSION.tgz" --json
