name: Published CLI check

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact public semantic version to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: published-cli-check-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify exact public package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node tools/published-cli-check.mts "$RELEASE_VERSION" --json
