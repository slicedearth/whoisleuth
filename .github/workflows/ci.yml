name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Scan changed lines for secrets
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECRET_SCAN_HEAD_SHA: ${{ github.sha }}
        run: npm run security:staged -- --range "$SECRET_SCAN_BASE_SHA..$SECRET_SCAN_HEAD_SHA"
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Verify release version
        run: npm run release:check
      - name: Verify production dependency notices
        run: npm run licenses:check
      - name: Verify optional-provider policy freshness
        run: npm run providers:policy-check
      - name: Verify reviewed technology evidence
        run: npm run technology:coverage-check
      - name: Verify scoped CLI package
        run: npm run cli:package:check
      - name: Verify architectural dependency boundaries
        run: npm run architecture:check
      - name: Audit production dependencies
        run: npm run dependencies:audit
      - name: Run type checks
        run: npm run typecheck
      - name: Check Svelte frontend
        run: npm run check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Run tests with production-source coverage
        run: npm run test:coverage
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-coverage
          path: test-coverage.lcov
          if-no-files-found: ignore
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/2
            label: 1-of-2
          - shard: 2/2
            label: 2-of-2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Build Svelte frontend
        run: npm run build
      - name: Enforce frontend loading budgets
        run: npm run frontend:loading-report
      - name: Scan built browser assets
        run: npm run security:retire
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
      - name: Run Playwright e2e shard
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
      - name: Summarize Playwright result data
        if: always()
        env:
          WHOISLEUTH_PLAYWRIGHT_RUN_LABEL: ${{ matrix.label }}
        run: npm run test:e2e:summary
      - name: Upload Playwright result data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results-${{ matrix.label }}
          path: playwright-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.label }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: ${{ always() }}
    needs:
      - quality
      - unit
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification lane to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success
