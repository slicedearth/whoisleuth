name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Scan changed lines for secrets
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECRET_SCAN_HEAD_SHA: ${{ github.sha }}
        run: npm run security:staged -- --range "$SECRET_SCAN_BASE_SHA..$SECRET_SCAN_HEAD_SHA"
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Verify development toolchain compatibility
        run: npm run toolchain:check
      - name: Verify release version
        run: npm run release:check
      - name: Verify retained timing and balanced browser plan
        run: npm run verification:timing:check
      - name: Verify focused ownership map
        run: npm run verification:ownership:check
      - name: Verify mandatory analyst journeys
        run: npm run verification:journeys:check
      - name: Verify canonical capability catalogue
        run: npm run capabilities:check
      - name: Verify canonical privacy catalogue
        run: npm run privacy:check
      - name: Verify schema lifecycle inventory
        run: npm run schema:inventory
      - name: Kill reviewed critical mutants
        run: npm run test:mutation
      - name: Verify production dependency notices
        run: npm run licenses:check
      - name: Verify optional-provider policy freshness
        run: npm run providers:policy-check
      - name: Verify reviewed technology evidence
        run: npm run technology:coverage-check
      - name: Verify scoped CLI package
        run: npm run cli:package:check
      - name: Verify architectural dependency boundaries
        run: npm run architecture:check
      - name: Audit production dependencies
        run: npm run dependencies:audit
      - name: Run type checks
        run: npm run typecheck
      - name: Check Svelte frontend
        run: npm run check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install tested shell
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Run tests with production-source coverage
        run: npm run test:coverage
      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-coverage
          path: test-coverage.lcov
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean generated unit artifacts
        if: always()
        run: npm run verification:artifacts -- --cleanup=unit

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: functional
            shard: 1/4
            label: 1-of-4
          - kind: functional
            shard: 2/4
            label: 2-of-4
          - kind: functional
            shard: 3/4
            label: 3-of-4
          - kind: functional
            shard: 4/4
            label: 4-of-4
          - kind: performance
            label: performance
    env:
      WHOISLEUTH_PLAYWRIGHT_RUN_KIND: ${{ matrix.kind }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Build Svelte frontend
        run: npm run build
      - name: Enforce frontend loading budgets
        run: npm run frontend:loading-report
      - name: Scan built browser assets
        run: npm run security:retire
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
      - name: Run Playwright functional shard
        if: ${{ matrix.kind == 'functional' }}
        run: npm run test:e2e:shard -- --run=${{ matrix.shard }}
      - name: Run isolated authenticated loading authority
        if: ${{ matrix.kind == 'performance' }}
        run: npm run frontend:authenticated-loading-report
      - name: Summarize Playwright result data
        if: always()
        env:
          WHOISLEUTH_PLAYWRIGHT_RUN_LABEL: ${{ matrix.label }}
          WHOISLEUTH_PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: npm run test:e2e:summary
      - name: Upload Playwright result data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results-${{ matrix.label }}
          path: playwright-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.label }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean generated browser artifacts and verify port state
        if: always()
        run: npm run verification:artifacts -- --cleanup=browser

  browser-health:
    needs:
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Download functional shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: playwright-results-*-of-4
          path: ${{ runner.temp }}/playwright-functional-results
          merge-multiple: true
      - name: Verify exact browser inventory and observed balance
        run: |
          reports=(
            --report="$RUNNER_TEMP/playwright-functional-results/shard-1-of-4.json"
            --report="$RUNNER_TEMP/playwright-functional-results/shard-2-of-4.json"
            --report="$RUNNER_TEMP/playwright-functional-results/shard-3-of-4.json"
            --report="$RUNNER_TEMP/playwright-functional-results/shard-4-of-4.json"
          )
          npm run test:e2e:aggregate -- "${reports[@]}" > "$RUNNER_TEMP/playwright-browser-aggregate.json"
          npm run test:e2e:aggregate -- --summary "${reports[@]}" | tee "$RUNNER_TEMP/playwright-browser-health.md"
          cat "$RUNNER_TEMP/playwright-browser-health.md" >> "$GITHUB_STEP_SUMMARY"
          npm run verification:timing:update-candidate -- \
            --lane=browser \
            --report="$RUNNER_TEMP/playwright-browser-aggregate.json" \
            --provenance-id="browser-ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            --environment=linux-x64-chromium-node24-ci \
            --sample-basis=complete-four-shard-functional-run \
            > "$RUNNER_TEMP/verification-timing-browser-candidate.json"
      - name: Upload browser timing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-timing-health
          path: |
            ${{ runner.temp }}/playwright-browser-aggregate.json
            ${{ runner.temp }}/playwright-browser-health.md
            ${{ runner.temp }}/verification-timing-browser-candidate.json
          if-no-files-found: error
          retention-days: 7

  cli-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up current public runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=optional --ignore-scripts
      - name: Exercise the installed CLI package boundary
        run: npm run cli:package:check

  verify:
    if: ${{ always() }}
    needs:
      - quality
      - unit
      - browser
      - browser-health
      - cli-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification lane to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BROWSER_HEALTH_RESULT: ${{ needs.browser-health.result }}
          CLI_RUNTIME_RESULT: ${{ needs.cli-runtime.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$BROWSER_HEALTH_RESULT" = success
          test "$CLI_RUNTIME_RESULT" = success
