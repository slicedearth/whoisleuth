version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "03:17"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "03:47"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    groups:
      pinned-actions:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope
