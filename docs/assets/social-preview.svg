<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">WHOISleuth domain intelligence</title>
  <desc id="description">A terminal-inspired overview showing a domain connected to registration, DNS, website, certificate, and network evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#151c24"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="44%" r="50%">
      <stop offset="0" stop-color="#5eb3ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5eb3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g opacity=".12" stroke="#5eb3ff">
    <path d="M0 80h1280M0 160h1280M0 240h1280M0 320h1280M0 400h1280M0 480h1280M0 560h1280"/>
    <path d="M80 0v640M160 0v640M240 0v640M320 0v640M400 0v640M480 0v640M560 0v640M640 0v640M720 0v640M800 0v640M880 0v640M960 0v640M1040 0v640M1120 0v640M1200 0v640"/>
  </g>

  <g transform="translate(74 68)">
    <circle cx="30" cy="30" r="21" fill="none" stroke="#5eb3ff" stroke-width="6"/>
    <path d="m45 46 22 22" fill="none" stroke="#5eb3ff" stroke-linecap="round" stroke-width="7"/>
    <path d="m20 23 18-3-9 21-9-18Z" fill="none" stroke="#7ee0a8" stroke-width="2"/>
    <circle cx="20" cy="23" r="4" fill="#7ee0a8"/>
    <circle cx="38" cy="20" r="4" fill="#7ee0a8"/>
    <circle cx="29" cy="41" r="4" fill="#7ee0a8"/>
    <text x="88" y="42" fill="#f2f6fb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="750" letter-spacing="-1.4">WHOISleuth</text>
    <circle cx="319" cy="34" r="4" fill="#7ee0a8"/>
  </g>

  <g transform="translate(76 194)">
    <text fill="#7ee0a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">DOMAIN INTELLIGENCE CONSOLE</text>
    <text y="66" fill="#f2f6fb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" font-weight="760" letter-spacing="-2.2">Understand the evidence.</text>
    <text y="124" fill="#5eb3ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" font-weight="760" letter-spacing="-2.2">Before you act.</text>
    <text y="177" fill="#9ba9ba" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">WHOIS, RDAP, DNS, certificates, website and network context</text>
    <text y="209" fill="#9ba9ba" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">with explicit source health, limits and analyst-controlled retention.</text>
  </g>

  <g transform="translate(728 125)">
    <rect x="0" y="0" width="486" height="420" rx="20" fill="#151a21" stroke="#2d3947" stroke-width="2"/>
    <rect x="0" y="0" width="486" height="48" rx="20" fill="#1b222b"/>
    <path d="M0 48h486" stroke="#2d3947"/>
    <circle cx="24" cy="24" r="5" fill="#ff6b77"/>
    <circle cx="43" cy="24" r="5" fill="#e8b45e"/>
    <circle cx="62" cy="24" r="5" fill="#7ee0a8"/>
    <text x="88" y="30" fill="#9ba9ba" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">evidence://source-map</text>

    <g stroke="#3d566c" stroke-width="2" fill="none">
      <path d="M243 210 120 110M243 210 120 210M243 210 120 310M243 210 366 110M243 210 366 210M243 210 366 310"/>
    </g>
    <circle cx="243" cy="210" r="50" fill="#1d2934" stroke="#5eb3ff" stroke-width="3"/>
    <circle cx="243" cy="210" r="63" fill="#5eb3ff" opacity=".06" filter="url(#soft-glow)"/>
    <text x="243" y="204" text-anchor="middle" fill="#f2f6fb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">DOMAIN</text>
    <text x="243" y="226" text-anchor="middle" fill="#9ba9ba" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">review target</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
      <g transform="translate(120 110)"><circle r="35" fill="#1d2934" stroke="#bb86fc" stroke-width="2"/><text y="4" fill="#f2f6fb">RDAP</text></g>
      <g transform="translate(120 210)"><circle r="35" fill="#1d2934" stroke="#5ed3f3" stroke-width="2"/><text y="4" fill="#f2f6fb">DNS</text></g>
      <g transform="translate(120 310)"><circle r="35" fill="#1d2934" stroke="#f28bd4" stroke-width="2"/><text y="4" fill="#f2f6fb">HTTP</text></g>
      <g transform="translate(366 110)"><circle r="35" fill="#1d2934" stroke="#8aa9ff" stroke-width="2"/><text y="4" fill="#f2f6fb">TLS</text></g>
      <g transform="translate(366 210)"><circle r="35" fill="#1d2934" stroke="#7ee0a8" stroke-width="2"/><text y="4" fill="#f2f6fb">PAGE</text></g>
      <g transform="translate(366 310)"><circle r="35" fill="#1d2934" stroke="#e8b45e" stroke-width="2"/><text y="4" fill="#f2f6fb">ASN</text></g>
    </g>

    <g transform="translate(22 375)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <circle cx="5" cy="3" r="4" fill="#7ee0a8"/>
      <text x="17" y="7" fill="#9ba9ba">sources remain separately attributed</text>
    </g>
  </g>

  <text x="76" y="588" fill="#6f8094" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">whoisleuth.com · open source · local first</text>
</svg>
