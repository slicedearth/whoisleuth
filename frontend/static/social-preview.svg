<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>WHOISleuth evidence topology preview</title>
  <desc>A domain connected to separately attributed registry, DNS, HTTP, TLS, page and network evidence sources.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1115" />
      <stop offset="1" stop-color="#141b24" />
    </linearGradient>
    <linearGradient id="target-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2b3b" />
      <stop offset="1" stop-color="#1a222d" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#263544" stroke-width="1" opacity=".58" />
    </pattern>
    <filter id="target-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feColorMatrix in="blur" values="0 0 0 0 0.23 0 0 0 0 0.68 0 0 0 0 1 0 0 0 .32 0" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .mono{font-family:SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace}
      .sans{font-family:Inter,Arial,sans-serif}
      .edge{fill:none;stroke-width:2;opacity:.72}
      .node-surface{fill:#171a21;stroke-width:2}
      .node-label{fill:#e6e8ee;font-size:13px;font-weight:750;letter-spacing:.02em}
      .node-family{fill:#8b93a7;font-size:9px;font-weight:650;letter-spacing:.1em}
      .icon-frame{fill:currentColor;fill-opacity:.09;stroke:currentColor;stroke-width:2}
      .icon{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .icon .icon-wash{fill:none}
      .icon .icon-detail{opacity:.72}
      .chip{fill:#161d26;stroke:#303b4a}
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#background)" />
  <rect width="1280" height="640" fill="url(#grid)" opacity=".72" />
  <path d="M0 560H1280" stroke="#2a3543" />

  <image href="favicon.svg" x="70" y="58" width="60" height="60" />
  <text x="148" y="101" class="mono" fill="#e6e8ee" font-size="31" font-weight="800" letter-spacing="-.8">WHOISleuth</text>
  <text x="70" y="173" class="mono" fill="#8b93a7" font-size="13" font-weight="750" letter-spacing="2.6">DOMAIN INTELLIGENCE CONSOLE</text>
  <rect x="70" y="190" width="72" height="3" rx="1.5" fill="#5eb3ff" />

  <text x="70" y="253" class="mono" fill="#e6e8ee" font-size="47" font-weight="800" letter-spacing="-2.4">Understand a domain.</text>
  <text x="70" y="313" class="mono" fill="#5eb3ff" font-size="47" font-weight="800" letter-spacing="-2.4">Before you act.</text>
  <text x="70" y="374" class="sans" fill="#aeb7c8" font-size="20">WHOIS, RDAP, DNS, certificates, website and network context</text>
  <text x="70" y="405" class="sans" fill="#aeb7c8" font-size="20">with explicit source health, limits and analyst-controlled retention.</text>

  <g class="mono" font-size="11" font-weight="750" letter-spacing="1">
    <rect class="chip" x="70" y="452" width="128" height="34" rx="7" />
    <text x="86" y="474" fill="#b89cff">WHOIS / RDAP</text>
    <rect class="chip" x="210" y="452" width="111" height="34" rx="7" />
    <text x="226" y="474" fill="#a3f7ff">DNS / TLS</text>
    <rect class="chip" x="333" y="452" width="150" height="34" rx="7" />
    <text x="349" y="474" fill="#e65ff2">WEB / NETWORK</text>
  </g>
  <text x="70" y="588" class="mono" fill="#7990a8" font-size="14" letter-spacing=".8">whoisleuth.com  /  open source  /  local first</text>

  <g>
    <rect x="690" y="72" width="535" height="492" rx="18" fill="#141a22" stroke="#314052" stroke-width="2" />
    <path d="M690 136H1225" stroke="#314052" />
    <text x="720" y="111" class="mono" fill="#e6e8ee" font-size="13" font-weight="750" letter-spacing="1.5">EVIDENCE TOPOLOGY</text>
    <text x="1178" y="111" class="mono" fill="#8b93a7" font-size="11" font-weight="700" text-anchor="end">6 SOURCES</text>
    <rect x="1190" y="97" width="7" height="7" rx="3.5" fill="#7ee0a8" />

    <path class="edge" d="M858 210C876 210 866 300 882 300" stroke="#9500ff" />
    <path class="edge" d="M858 320C868 320 872 323 882 323" stroke="#a3f7ff" />
    <path class="edge" d="M858 430C876 430 866 346 882 346" stroke="#e65ff2" />
    <path class="edge" d="M1032 300C1048 290 1040 210 1056 210" stroke="#307fa6" />
    <path class="edge" d="M1032 323C1042 323 1046 320 1056 320" stroke="#aa84f5" />
    <path class="edge" d="M1032 346C1048 356 1040 430 1056 430" stroke="#006bd6" />

    <g color="#9500ff">
      <rect class="node-surface" x="710" y="176" width="148" height="68" rx="4" stroke="currentColor" />
      <circle class="icon-frame" cx="736" cy="200" r="16" />
      <g class="icon" transform="translate(724 188)"><ellipse class="icon-wash" cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/><path class="icon-detail" d="M16.7 8.2v1.7M16.7 14.2v1.7"/></g>
      <text class="mono node-label" x="762" y="202">REGISTRY</text>
      <text class="mono node-family" x="762" y="220">AUTHORITATIVE</text>
      <circle cx="842" cy="190" r="4" fill="#7ee0a8" />
    </g>

    <g color="#a3f7ff">
      <rect class="node-surface" x="710" y="286" width="148" height="68" rx="10" stroke="currentColor" />
      <circle class="icon-frame" cx="736" cy="310" r="16" />
      <g class="icon" transform="translate(724 298)"><circle class="icon-wash" cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5S14.3 18.1 12 20.5M12 3.5C9.7 5.9 8.5 8.7 8.5 12s1.2 6.1 3.5 8.5"/></g>
      <text class="mono node-label" x="762" y="312">DNS</text>
      <text class="mono node-family" x="762" y="330">NETWORK</text>
      <circle cx="842" cy="300" r="4" fill="#7ee0a8" />
    </g>

    <g color="#e65ff2">
      <rect class="node-surface" x="710" y="396" width="148" height="68" rx="15" stroke="currentColor" />
      <circle class="icon-frame" cx="736" cy="420" r="16" />
      <g class="icon" transform="translate(724 408)"><rect class="icon-wash" x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9h17M7 7h.1M10 7h.1M7 12.5l2 2-2 2M11.5 16.5H16"/></g>
      <text class="mono node-label" x="762" y="422">HTTP</text>
      <text class="mono node-family" x="762" y="440">WEB</text>
      <circle cx="842" cy="410" r="4" fill="#7ee0a8" />
    </g>

    <g color="#307fa6">
      <rect class="node-surface" x="1056" y="176" width="148" height="68" rx="4" stroke="currentColor" />
      <circle class="icon-frame" cx="1082" cy="200" r="16" />
      <g class="icon" transform="translate(1070 188)"><path class="icon-wash" d="M12 3.5 19 6v5.5c0 4.4-2.8 7.4-7 9-4.2-1.6-7-4.6-7-9V6z"/><rect x="8.5" y="10.5" width="7" height="5.5" rx="1.2"/><path d="M10 10.5V9a2 2 0 0 1 4 0v1.5M12 13v1"/></g>
      <text class="mono node-label" x="1108" y="202">TLS</text>
      <text class="mono node-family" x="1108" y="220">CERTIFICATE</text>
      <circle cx="1188" cy="190" r="4" fill="#7ee0a8" />
    </g>

    <g color="#aa84f5">
      <rect class="node-surface" x="1056" y="286" width="148" height="68" rx="15" stroke="currentColor" />
      <circle class="icon-frame" cx="1082" cy="310" r="16" />
      <g class="icon" transform="translate(1070 298)"><path class="icon-wash" d="M6 3.5h9l3 3V20.5H6z"/><path d="M6 3.5h9l3 3V20.5H6zM15 3.5v3h3"/><path class="icon-detail" d="M9 11c1.8-2 4.2-2 6 0M9 14c1.8-2 4.2-2 6 0M10.5 17c1-1 2-1 3 0"/></g>
      <text class="mono node-label" x="1108" y="312">PAGE</text>
      <text class="mono node-family" x="1108" y="330">IDENTITY</text>
      <circle cx="1188" cy="300" r="4" fill="#7ee0a8" />
    </g>

    <g color="#006bd6">
      <rect class="node-surface" x="1056" y="396" width="148" height="68" rx="10" stroke="currentColor" />
      <circle class="icon-frame" cx="1082" cy="420" r="16" />
      <g class="icon" transform="translate(1070 408)"><path class="icon-detail" d="m7.8 11 7.8-3.6M7.8 13l7.8 3.6"/><circle class="icon-wash" cx="6" cy="12" r="2"/><circle class="icon-wash" cx="17.5" cy="6.5" r="2"/><circle class="icon-wash" cx="17.5" cy="17.5" r="2"/></g>
      <text class="mono node-label" x="1108" y="422">NETWORK</text>
      <text class="mono node-family" x="1108" y="440">IP / ASN</text>
      <circle cx="1188" cy="410" r="4" fill="#7ee0a8" />
    </g>

    <g filter="url(#target-glow)">
      <rect x="882" y="279" width="150" height="88" rx="12" fill="url(#target-surface)" stroke="#5eb3ff" stroke-width="2" />
      <text x="898" y="305" class="mono" fill="#5eb3ff" font-size="9" font-weight="800" letter-spacing="1.4">LOOKUP TARGET</text>
      <text x="898" y="332" class="mono" fill="#e6e8ee" font-size="14" font-weight="800">example.test</text>
      <text x="898" y="351" class="mono" fill="#8b93a7" font-size="9">domain evidence</text>
    </g>

    <g class="mono" font-size="9" font-weight="650" letter-spacing=".7">
      <circle cx="730" cy="527" r="4" fill="#7ee0a8" />
      <text x="742" y="530" fill="#9ba7b8">DOT SHOWS SOURCE STATE</text>
      <path d="M913 527h26" stroke="#b89cff" stroke-width="2" />
      <text x="948" y="530" fill="#9ba7b8">COLOUR IDENTIFIES SOURCE</text>
    </g>
  </g>
</svg>
